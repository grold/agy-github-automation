name: Antigravity PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Review PR with Antigravity
    runs-on: ubuntu-latest

    # Optional: Skip review on PRs from external unvetted forks if desired, or run on all PRs opened/synced
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Runner Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/Dockerfile
          load: true
          tags: agy-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute PR Reviewer Agent in Isolated Container
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          AGY_AUTH_BASE64: ${{ secrets.AGY_AUTH_BASE64 }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e GITHUB_TOKEN \
            -e GH_TOKEN \
            -e GITHUB_REPOSITORY \
            -e PR_NUMBER \
            -e AGY_AUTH_BASE64 \
            agy-runner:latest \
            /workspace/.github/scripts/run-reviewer.sh
