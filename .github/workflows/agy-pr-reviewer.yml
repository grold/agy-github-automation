name: Antigravity PR Reviewer

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull Request number to review"
        required: false
        type: string
      runner_image:
        description: "Runner container image to use"
        required: false
        type: string
        default: "ghcr.io/grold/agy-runner:latest"
    secrets:
      AGY_AUTH_BASE64:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      BOT_GITHUB_TOKEN:
        required: false
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to review"
        required: true
        type: string
      runner_image:
        description: "Runner container image to use"
        required: false
        type: string
        default: "ghcr.io/grold/agy-runner:latest"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Review PR with Antigravity
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Prepare Runner Container
        run: |
          IMAGE="${{ inputs.runner_image || 'ghcr.io/grold/agy-runner:latest' }}"
          echo "PULLING_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          if docker pull "$IMAGE"; then
            echo "Successfully pulled $IMAGE"
          else
            echo "Image $IMAGE not yet found in registry. Falling back to local build..."
            docker build -t "$IMAGE" -f .github/docker/Dockerfile .
          fi

      - name: Execute PR Reviewer Agent in Isolated Container
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          AGY_AUTH_BASE64: ${{ secrets.AGY_AUTH_BASE64 }}
          AI_MODEL_NAME: "Gemini 3.8 Flash"
          AI_REASONING_EFFORT: "Medium"
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e GITHUB_TOKEN \
            -e GH_TOKEN \
            -e GITHUB_REPOSITORY \
            -e PR_NUMBER \
            -e AGY_AUTH_BASE64 \
            -e AI_MODEL_NAME \
            -e AI_REASONING_EFFORT \
            "$PULLING_IMAGE" \
            bash -c "if [ -x /opt/agy-automation/scripts/run-reviewer.sh ]; then /opt/agy-automation/scripts/run-reviewer.sh; else /workspace/.github/scripts/run-reviewer.sh; fi"
