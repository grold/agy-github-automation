name: Antigravity Issue Solver

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to solve"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve:
    name: Solve Issue with Antigravity
    runs-on: ubuntu-latest

    # Only run for authorized repository collaborators/members/owners or when labeled 'agent:solve'
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'opened' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event.action == 'labeled' && github.event.label.name == 'agent:solve' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.sender.author_association))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Runner Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/Dockerfile
          load: true
          tags: agy-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure Git identity
        run: |
          git config --global user.name "antigravity-bot[bot]"
          git config --global user.email "antigravity-bot[bot]@users.noreply.github.com"

      - name: Execute Issue Solver Agent in Isolated Container
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title || 'Manual Trigger' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          AGY_AUTH_BASE64: ${{ secrets.AGY_AUTH_BASE64 }}
          BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e GITHUB_TOKEN \
            -e GH_TOKEN \
            -e GITHUB_REPOSITORY \
            -e ISSUE_NUMBER \
            -e ISSUE_TITLE \
            -e ISSUE_BODY \
            -e AGY_AUTH_BASE64 \
            -e BASE_BRANCH \
            agy-runner:latest \
            /workspace/.github/scripts/run-solver.sh
