name: Antigravity Issue Solver

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to solve"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve:
    name: Solve Issue with Antigravity
    runs-on: ubuntu-latest

    # Only run for authorized repository collaborators/members/owners or when labeled 'agent:solve'
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'opened' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event.action == 'labeled' && github.event.label.name == 'agent:solve' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.sender.author_association))

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build Runner Container
        run: docker build -t agy-runner:latest -f .github/docker/Dockerfile .

      - name: Configure Git identity
        run: |
          SLUG="${{ steps.app-token.outputs.app-slug }}"
          if [ -n "$SLUG" ]; then
            BOT_NAME="${SLUG}[bot]"
            BOT_EMAIL="${SLUG}[bot]@users.noreply.github.com"
          else
            BOT_NAME="antigravity-bot[bot]"
            BOT_EMAIL="antigravity-bot[bot]@users.noreply.github.com"
          fi
          git config --global user.name "$BOT_NAME"
          git config --global user.email "$BOT_EMAIL"
          echo "BOT_NAME=$BOT_NAME" >> "$GITHUB_ENV"
          echo "BOT_EMAIL=$BOT_EMAIL" >> "$GITHUB_ENV"

      - name: Execute Issue Solver Agent in Isolated Container
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          BOT_NAME: ${{ env.BOT_NAME }}
          BOT_EMAIL: ${{ env.BOT_EMAIL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title || 'Manual Trigger' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          AGY_AUTH_BASE64: ${{ secrets.AGY_AUTH_BASE64 }}
          BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e GITHUB_TOKEN \
            -e GH_TOKEN \
            -e BOT_NAME \
            -e BOT_EMAIL \
            -e GITHUB_REPOSITORY \
            -e ISSUE_NUMBER \
            -e ISSUE_TITLE \
            -e ISSUE_BODY \
            -e AGY_AUTH_BASE64 \
            -e BASE_BRANCH \
            agy-runner:latest \
            /workspace/.github/scripts/run-solver.sh
