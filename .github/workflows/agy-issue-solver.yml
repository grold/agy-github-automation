name: Antigravity Issue Solver

on:
  workflow_call:
    inputs:
      issue_number:
        description: "Issue number to solve"
        required: false
        type: string
      base_branch:
        description: "Target base branch for PR"
        required: false
        type: string
        default: "main"
      runner_image:
        description: "Runner container image to use"
        required: false
        type: string
        default: "ghcr.io/grold/agy-runner:latest"
    secrets:
      AGY_AUTH_BASE64:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      BOT_GITHUB_TOKEN:
        required: false
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to solve"
        required: true
        type: string
      runner_image:
        description: "Runner container image to use"
        required: false
        type: string
        default: "ghcr.io/grold/agy-runner:latest"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve:
    name: Solve Issue with Antigravity
    runs-on: ubuntu-latest

    # Only run when called via workflow_call, workflow_dispatch, opened by collaborators, or labeled agent:solve
    if: >
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'opened' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event.action == 'labeled' && github.event.label.name == 'agent:solve')

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Prepare Runner Container
        run: |
          IMAGE="${{ inputs.runner_image || 'ghcr.io/grold/agy-runner:latest' }}"
          echo "PULLING_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          if docker pull "$IMAGE"; then
            echo "Successfully pulled $IMAGE"
          else
            echo "Image $IMAGE not yet found in registry. Falling back to local build..."
            docker build -t "$IMAGE" -f .github/docker/Dockerfile .
          fi

      - name: Configure Git identity
        run: |
          SLUG="${{ steps.app-token.outputs.app-slug }}"
          if [ -n "$SLUG" ]; then
            BOT_NAME="${SLUG}[bot]"
            BOT_EMAIL="${SLUG}[bot]@users.noreply.github.com"
          else
            BOT_NAME="antigravity-bot[bot]"
            BOT_EMAIL="antigravity-bot[bot]@users.noreply.github.com"
          fi
          git config --global user.name "$BOT_NAME"
          git config --global user.email "$BOT_EMAIL"
          echo "BOT_NAME=$BOT_NAME" >> "$GITHUB_ENV"
          echo "BOT_EMAIL=$BOT_EMAIL" >> "$GITHUB_ENV"

      - name: Execute Issue Solver Agent in Isolated Container
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          BOT_NAME: ${{ env.BOT_NAME }}
          BOT_EMAIL: ${{ env.BOT_EMAIL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title || 'Manual Trigger' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          AGY_AUTH_BASE64: ${{ secrets.AGY_AUTH_BASE64 }}
          BASE_BRANCH: ${{ inputs.base_branch || github.event.repository.default_branch || 'main' }}
          AI_MODEL_NAME: "Gemini 3.8 Flash"
          AI_REASONING_EFFORT: "Medium"
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e GITHUB_TOKEN \
            -e GH_TOKEN \
            -e BOT_NAME \
            -e BOT_EMAIL \
            -e GITHUB_REPOSITORY \
            -e ISSUE_NUMBER \
            -e ISSUE_TITLE \
            -e ISSUE_BODY \
            -e AGY_AUTH_BASE64 \
            -e BASE_BRANCH \
            -e AI_MODEL_NAME \
            -e AI_REASONING_EFFORT \
            "$PULLING_IMAGE" \
            bash -c "if [ -x /opt/agy-automation/scripts/run-solver.sh ]; then /opt/agy-automation/scripts/run-solver.sh; else /workspace/.github/scripts/run-solver.sh; fi"
