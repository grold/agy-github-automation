name: Publish Runner Image to GHCR

on:
  push:
    branches: [main]
    paths:
      - '.github/docker/**'
      - '.github/scripts/**'
      - '.github/agents/**'
      - '.github/workflows/publish-runner-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Publish Container Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract repository lowercase name
        id: repo-slug
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/agy-runner" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.repo-slug.outputs.image }}:latest
            ${{ steps.repo-slug.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
